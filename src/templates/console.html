<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>easy-jarvis | Cinematic Console</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bumble-yellow: #FFD200;
            --stark-blue: #00D2FF;
            --dark-bg: #0A0A0B;
            --hud-glow: rgba(255, 210, 0, 0.15);
            --danger-red: #ff4b2b;
            --success-green: #00ff88;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: var(--dark-bg);
            color: white;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #hud-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.4;
        }

        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 210, 0, 0.2);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .arc-reactor {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--bumble-yellow) 20%, transparent 70%);
            box-shadow: 0 0 20px var(--bumble-yellow);
            animation: pulse 2s infinite ease-in-out;
            cursor: pointer;
        }

        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hologram-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 210, 0, 0.15);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(5px);
            max-width: 80%;
            position: relative;
        }

        /* --- Swipe Overlay --- */
        #swipe-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
            transition: opacity 0.5s;
        }

        .swipe-card {
            width: 320px;
            height: 450px;
            background: rgba(20, 20, 22, 0.9);
            border: 2px solid var(--bumble-yellow);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            box-shadow: 0 0 50px var(--hud-glow);
            position: relative;
            cursor: grab;
            user-select: none;
        }

        .swipe-label {
            font-size: 24px;
            font-weight: 700;
            color: var(--bumble-yellow);
            margin-bottom: 10px;
        }

        .swipe-hint {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 40px;
        }

        .swipe-indicator {
            position: absolute;
            font-size: 80px;
            font-weight: 900;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .swipe-indicator.yes { color: var(--success-green); left: 20px; transform: rotate(-20deg); }
        .swipe-indicator.no { color: var(--danger-red); right: 20px; transform: rotate(20deg); }

        .footer {
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
        }

        .input-group {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        input {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 210, 0, 0.3);
            border-radius: 30px;
            padding: 15px 25px;
            color: white;
            outline: none;
        }
    </style>
</head>
<body>

    <canvas id="hud-canvas"></canvas>

    <!-- Swipe-to-Sync Overlay -->
    <div id="swipe-overlay">
        <div class="swipe-card" id="current-swipe-card">
            <div class="swipe-indicator yes">YES</div>
            <div class="swipe-indicator no">NO</div>
            <div id="habit-icon" style="font-size: 60px; margin-bottom: 20px;">📱</div>
            <div class="swipe-label" id="habit-name">No Phone?</div>
            <div style="font-size: 14px; opacity: 0.8;">Did you resist the morning scroll?</div>
            
            <div class="swipe-hint">
                [ ← Swipe Left for NO ] &nbsp;&nbsp; [ Swipe Right for YES → ]
            </div>
        </div>
        
        <!-- Weight Input (Hidden until sequence ends) -->
        <div class="swipe-card" id="weight-card" style="display: none; cursor: default;">
             <div class="swipe-label">Current Weight</div>
             <input type="number" id="weight-input" placeholder="lbs" style="width: 100px; text-align: center; margin: 20px 0;">
             <button onclick="submitMatrix()" style="background: var(--bumble-yellow); border: none; padding: 10px 30px; border-radius: 20px; font-weight: 700; cursor: pointer;">SYNC MATRIX</button>
        </div>
    </div>

    <div class="header">
        <div>
            <div style="font-weight: 700; font-size: 18px; letter-spacing: 2px;">EASY-JARVIS</div>
            <div style="font-size: 10px; color: var(--bumble-yellow);">SYSTEM STATUS: ONLINE</div>
        </div>
        <div class="arc-reactor" id="arc-reactor"></div>
    </div>

    <div class="chat-container" id="chat-feed">
        <div class="hologram-card">I am awake, simpleprogrammer. Life Matrix sync pending.</div>
    </div>

    <div class="footer">
        <div class="input-group">
            <input type="text" id="user-input" placeholder="Type a command...">
            <button onclick="sendChat()" style="background:var(--bumble-yellow); border:none; border-radius:50%; width:50px; height:50px; cursor:pointer;">🚀</button>
        </div>
    </div>

    <script>
        // --- Habits Sequence ---
        const habits = [
            { id: 'no_phone', name: 'No Phone?', icon: '📱', hint: 'Did you resist the morning scroll?' },
            { id: 'read_book', name: 'Read Book?', icon: '📚', hint: 'Did you feed the brain today?' },
            { id: 'exercise', name: 'Exercise?', icon: '🏃', hint: 'Did you move your physical body?' },
            { id: 'meditation', name: 'Meditation?', icon: '🧘', hint: 'Did you find the silence?' }
        ];
        
        let currentHabitIndex = 0;
        const matrixData = {};
        const needsWeight = {{ 'true' if needs_weight else 'false' }};

        // --- Swipe Logic ---
        const card = document.getElementById('current-swipe-card');
        const yesIndicator = card.querySelector('.yes');
        const noIndicator = card.querySelector('.no');
        let startX = 0;
        let isDragging = false;

        card.addEventListener('mousedown', (e) => { startX = e.clientX; isDragging = true; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const delta = e.clientX - startX;
            card.style.transform = `translateX(${delta}px) rotate(${delta * 0.05}deg)`;
            
            yesIndicator.style.opacity = delta > 50 ? (delta - 50) / 100 : 0;
            noIndicator.style.opacity = delta < -50 ? (-delta - 50) / 100 : 0;
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            const delta = e.clientX - startX;
            
            if (delta > 150) finalizeHabit(true);
            else if (delta < -150) finalizeHabit(false);
            else {
                card.style.transform = 'none';
                yesIndicator.style.opacity = 0;
                noIndicator.style.opacity = 0;
            }
        });

        function finalizeHabit(value) {
            const habit = habits[currentHabitIndex];
            matrixData[habit.id] = value;
            
            currentHabitIndex++;
            if (currentHabitIndex < habits.length) {
                // Load Next
                const next = habits[currentHabitIndex];
                document.getElementById('habit-name').innerText = next.name;
                document.getElementById('habit-icon').innerText = next.icon;
                card.style.transform = 'none';
                yesIndicator.style.opacity = 0;
                noIndicator.style.opacity = 0;
            } else {
                // Show Weight or Finish
                card.style.display = 'none';
                if (needsWeight) {
                    document.getElementById('weight-card').style.display = 'flex';
                } else {
                    submitMatrix();
                }
            }
        }

        async function submitMatrix() {
            // 1. Log Habits
            await fetch('/matrix/log-habits', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(matrixData)
            });

            // 2. Log Weight if provided
            const wInput = document.getElementById('weight-input');
            if (wInput && wInput.value) {
                await fetch('/matrix/log-weight', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ weight: wInput.value })
                });
            }

            // 3. Hide Overlay
            document.getElementById('swipe-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('swipe-overlay').style.display = 'none';
                appendMessage('JARVIS', 'Matrix Sync Complete. Physical metrics updated.');
            }, 500);
        }

        // --- Basic Chat Logic ---
        function appendMessage(role, text) {
            const feed = document.getElementById('chat-feed');
            const card = document.createElement('div');
            card.className = 'hologram-card';
            card.innerText = text;
            feed.appendChild(card);
            feed.scrollTop = feed.scrollHeight;
        }

        async function sendChat() {
            const input = document.getElementById('user-input');
            if (!input.value) return;
            appendMessage('USER', input.value);
            input.value = '';
        }
    </script>
</body>
</html>
