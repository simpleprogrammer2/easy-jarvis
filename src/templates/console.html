<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jarvis | Personnal AI Assistant</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bumble-yellow: #FFD200;
            --stark-blue: #00D2FF;
            --dark-bg: #0A0A0B;
            --hud-glow: rgba(255, 210, 0, 0.15);
            --danger-red: #ff4b2b;
            --success-green: #00ff88;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: var(--dark-bg);
            color: white;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #hud-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.4;
        }

        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 210, 0, 0.2);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .arc-reactor {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--bumble-yellow) 20%, transparent 70%);
            box-shadow: 0 0 20px var(--bumble-yellow);
            animation: pulse 2s infinite ease-in-out;
            cursor: pointer;
        }

        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hologram-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 210, 0, 0.15);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(5px);
            max-width: 80%;
            position: relative;
        }

        /* --- Swipe Overlay --- */
        #swipe-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
            transition: opacity 0.5s;
        }

        .swipe-card {
            width: 320px;
            height: 400px;
            background: rgba(20, 20, 22, 0.95);
            border: 2px solid var(--bumble-yellow);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            box-shadow: 0 0 60px rgba(0,0,0,0.5);
            position: relative;
            cursor: grab;
            user-select: none;
        }

        .swipe-label {
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-top: 20px;
        }

        .habit-icon-large {
            font-size: 100px;
            filter: drop-shadow(0 0 20px var(--hud-glow));
        }

        .swipe-hint {
            font-size: 11px;
            opacity: 0.5;
            margin-top: 30px;
            letter-spacing: 1px;
        }

        .swipe-indicator {
            position: absolute;
            font-size: 80px;
            font-weight: 900;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .swipe-indicator.yes { color: var(--success-green); left: 20px; transform: rotate(-20deg); }
        .swipe-indicator.no { color: var(--danger-red); right: 20px; transform: rotate(20deg); }

        .footer {
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
        }

        .input-group {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        input {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 210, 0, 0.3);
            border-radius: 30px;
            padding: 15px 25px;
            color: white;
            outline: none;
        }
    </style>
</head>
<body style="display: flex; flex-direction: column; height: 100vh; margin: 0; background: var(--dark-bg); color: white; font-family: 'Poppins', sans-serif;">

    <canvas id="hud-canvas"></canvas>

    <!-- Swipe-to-Sync Overlay -->
    <div id="swipe-overlay" style="display:none;">
        <div class="swipe-card" id="current-swipe-card">
            <div class="swipe-indicator yes">YES</div>
            <div class="swipe-indicator no">NO</div>
            <div id="habit-icon"><div class="habit-icon-large">📱</div></div>
            <div class="swipe-label" id="habit-name">NO PHONE</div>
            
            <div class="swipe-hint">
                [ ← NO ] &nbsp;&nbsp; [ YES → ]
            </div>
            
            <button onclick="closeHabitOverlay()" style="margin-top: 20px; background: transparent; border: 1px solid var(--danger-red); color: white; border-radius: 15px; padding: 5px 15px; cursor: pointer;">Abort tracker</button>
        </div>
        
        <!-- Weight Input (Hidden until sequence ends) -->
        <div class="swipe-card" id="weight-card" style="display: none; cursor: default;">
             <div class="habit-icon-large">⚖️</div>
             <div class="swipe-label">Current Weight</div>
             <input type="number" id="weight-input" placeholder="kg" style="width: 120px; text-align: center; margin: 25px 0; font-size: 24px;">
             <button onclick="submitMatrix()" style="background: var(--bumble-yellow); border: none; padding: 15px 40px; border-radius: 30px; font-weight: 700; cursor: pointer; letter-spacing: 1px;">SYNC MATRIX</button>
        </div>
    </div>

    <div class="header">
        <div>
            <div style="font-weight: 700; font-size: 18px; letter-spacing: 2px;">JARVIS</div>
            <div style="font-size: 10px; color: var(--bumble-yellow);">SYSTEM STATUS: ONLINE</div>
        </div>
        <div class="arc-reactor" id="arc-reactor"></div>
    </div>

    <!-- Habit Dashboard (Top) -->
    <div id="habit-dashboard" style="padding: 15px; background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255, 210, 0, 0.2);">
        <h3 style="margin-top: 0;">Habit Matrix (Last 7 Days)</h3>
        <div id="habit-history-list"></div>
    </div>

    <!-- Chat Panel (Bottom - grows to fill space) -->
    <div class="chat-container" id="chat-feed" style="flex-grow: 1; overflow-y: auto; padding: 20px;">
        <div class="hologram-card">I am awake, Lets get started....</div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="input-group" style="flex-direction: column; gap: 10px;">
            <div id="quick-actions" style="display: flex; gap: 10px;">
                <button onclick="sendChat('Review reminders')" style="background:transparent; border:1px solid var(--bumble-yellow); color:white; border-radius:15px; padding:5px 15px; cursor:pointer;">Review reminders</button>
                <button onclick="sendChat('Track habits')" style="background:transparent; border:1px solid var(--bumble-yellow); color:white; border-radius:15px; padding:5px 15px; cursor:pointer;">Track habits</button>
                <button onclick="sendChat('Clear')" style="background:transparent; border:1px solid var(--danger-red); color:white; border-radius:15px; padding:5px 15px; cursor:pointer;">Clear</button>
            </div>
            <div style="display: flex; gap: 15px; width: 100%;">
                <input type="text" id="user-input" placeholder="Type a command...">
                <button onclick="sendChat()" style="background:var(--bumble-yellow); border:none; border-radius:50%; width:50px; height:50px; cursor:pointer;">🚀</button>
            </div>
        </div>
    </div>

    <script>
        // --- Habits Sequence ---
        const habits = [
            { id: 'no_phone', name: 'NO PHONE', icon: '📱', hint: 'Morning scroll resisted?' },
            { id: 'read_book', name: 'READ BOOK', icon: '📚', hint: 'Brain fed?' },
            { id: 'exercise', name: 'EXERCISE', icon: '🏃', hint: 'Body moved?' },
            { id: 'meditation', name: 'MEDITATION', icon: '🧘', hint: 'Silence found?' }
        ];
        
        let currentHabitIndex = 0;
        const matrixData = {};
        const needsWeight = {{ 'true' if needs_weight else 'false' }};

        // --- Swipe Logic ---
        const card = document.getElementById('current-swipe-card');
        const yesIndicator = card.querySelector('.yes');
        const noIndicator = card.querySelector('.no');
        let startX = 0;
        let isDragging = false;

        card.addEventListener('mousedown', (e) => { startX = e.clientX; isDragging = true; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const delta = e.clientX - startX;
            card.style.transform = `translateX(${delta}px) rotate(${delta * 0.05}deg)`;
            
            yesIndicator.style.opacity = delta > 50 ? (delta - 50) / 100 : 0;
            noIndicator.style.opacity = delta < -50 ? (-delta - 50) / 100 : 0;
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            const delta = e.clientX - startX;
            
            if (delta > 150) finalizeHabit(true);
            else if (delta < -150) finalizeHabit(false);
            else {
                card.style.transform = 'none';
                yesIndicator.style.opacity = 0;
                noIndicator.style.opacity = 0;
            }
        });

        function closeHabitOverlay() {
            document.getElementById('swipe-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('swipe-overlay').style.display = 'none';
            }, 500);
            
            // Reset state
            currentHabitIndex = 0;
            document.getElementById('current-swipe-card').style.display = 'flex';
            document.getElementById('weight-card').style.display = 'none';
        }

        function finalizeHabit(value) {
            const habit = habits[currentHabitIndex];
            matrixData[habit.id] = value;
            
            currentHabitIndex++;
            if (currentHabitIndex < habits.length) {
                // Load Next
                const next = habits[currentHabitIndex];
                document.getElementById('habit-name').innerText = next.name;
                document.getElementById('habit-icon').innerHTML = `<div class="habit-icon-large">${next.icon}</div>`;
                card.style.transform = 'none';
                yesIndicator.style.opacity = 0;
                noIndicator.style.opacity = 0;
            } else {
                // Show Weight or Finish
                card.style.display = 'none';
                if (needsWeight) {
                    document.getElementById('weight-card').style.display = 'flex';
                } else {
                    submitMatrix();
                }
            }
        }

        async function submitMatrix() {
            // Ensure all required habit keys exist in the payload
            const fullHabitData = {
                no_phone: matrixData.no_phone || false,
                read_book: matrixData.read_book || false,
                exercise: matrixData.exercise || false,
                meditation: matrixData.meditation || false
            };

            // 1. Log Habits
            await fetch('/matrix/log-habits', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(fullHabitData)
            });
            
            // Refresh dashboard
            loadHabitDashboard();

            // 2. Log Weight if provided
            const wInput = document.getElementById('weight-input');
            if (wInput && wInput.value) {
                await fetch('/matrix/log-weight', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ weight: wInput.value })
                });
            }

            // 3. Hide Overlay
            document.getElementById('swipe-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('swipe-overlay').style.display = 'none';
            }, 500);
        }

        // --- Habit Dashboard ---
        async function loadHabitDashboard() {
            const response = await fetch('/matrix/habits-history');
            const history = await response.json();
            const list = document.getElementById('habit-history-list');
            list.innerHTML = '';
            
            // Generate last 7 days
            const days = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                days.push(d.toISOString().split('T')[0]);
            }
            
            days.forEach(date => {
                const dayData = history.find(h => h.date === date);
                const item = document.createElement('div');
                item.style.borderBottom = "1px solid #333";
                item.style.padding = "5px 0";
                
                if (dayData) {
                    item.innerHTML = `
                        <div style="display: flex; gap: 15px; font-size: 14px;">
                            <span style="width: 100px;">${date}</span>
                            <span>${dayData.no_phone ? '📱' : '❌'}</span>
                            <span>${dayData.read_book ? '📚' : '❌'}</span>
                            <span>${dayData.exercise ? '🏃' : '❌'}</span>
                            <span>${dayData.meditation ? '🧘' : '❌'}</span>
                        </div>
                    `;
                } else {
                    item.innerHTML = `
                        <div style="display: flex; gap: 15px; font-size: 14px; opacity: 0.3;">
                            <span style="width: 100px;">${date}</span>
                            <span>-</span><span>-</span><span>-</span><span>-</span>
                        </div>
                    `;
                }
                list.appendChild(item);
            });
        }
        
        loadHabitDashboard();

        // --- Basic Chat Logic ---
        function appendMessage(role, message) {
            const feed = document.getElementById('chat-feed');
            const card = document.createElement('div');
            card.className = 'hologram-card';
            
            if (Array.isArray(message) && message.length > 0) {
                const ul = document.createElement('ul');
                message.forEach(r => {
                    const li = document.createElement('li');
                    
                    // Attempt to split name and date if format is "Name (Due: Date)"
                    const match = r.match(/^(.*) \(Due: (.*)\)$/);
                    if (match) {
                        const name = document.createElement('span');
                        name.innerText = match[1];
                        name.style.display = 'block'; // Ensure name is on its own line
                        
                        const date = document.createElement('span');
                        date.innerText = '📅 ' + match[2];
                        date.style.color = 'var(--bumble-yellow)'; // Use established yellow accent
                        date.style.fontSize = '0.85em';
                        date.style.display = 'block'; // Ensure date is on its own line
                        date.style.marginTop = '2px';
                        
                        li.appendChild(name);
                        li.appendChild(date);
                    } else {
                        li.innerText = r;
                    }
                    
                    ul.appendChild(li);
                });
                card.appendChild(ul);
            } else {
                card.innerText = Array.isArray(message) ? 'No active reminders.' : message;
            }
            
            feed.appendChild(card);
            feed.scrollTop = feed.scrollHeight;
        }

        async function sendChat(predefinedCommand) {
            const input = document.getElementById('user-input');
            const command = predefinedCommand || input.value;
            
            if (!command) return;
            appendMessage('USER', command);
            input.value = '';

            const cmd = command.toLowerCase();
            
            try {
                if (cmd === 'clear') {
                    // Success (Empty/Silent)
                    const feed = document.getElementById('chat-feed');
                    feed.innerHTML = '';
                } else if (cmd === 'track habits') {
                    // Success (Action-based)
                    document.getElementById('swipe-overlay').style.display = 'flex';
                    document.getElementById('swipe-overlay').style.opacity = '1';
                } else if (cmd === 'review reminders') {
                    // Success (With Data)
                    const res = await fetch('/api/reminders');
                    if (!res.ok) throw new Error('Could not fetch reminders');
                    const data = await res.json();
                    appendMessage('JARVIS', data.reminders || 'No active reminders.');
                } else {
                    // Failed (Unknown)
                    throw new Error('Unknown command: ' + command);
                }
            } catch (error) {
                // Failed (Message)
                appendMessage('SYSTEM', 'Failed: ' + error.message);
            }
        }
    </script>
</body>
</html>
