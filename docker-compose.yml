version: '3.8'

services:
  easy-jarvis:
    build: .
    container_name: easy-jarvis
    env_file: .env
    environment:
      - PULSE_SERVER=host.docker.internal
    volumes:
      - .:/app
      - ./memory:/app/memory
    stdin_open: true 
    tty: true        
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  teammate:
    build: .
    container_name: easy-jarvis-teammate
    env_file: .env
    volumes:
      - .:/app
    command: ["python3", "src/scripts/night_shift.py"]
    restart: unless-stopped
    depends_on:
      - easy-jarvis
