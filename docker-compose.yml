version: '3.8'

services:
  easy-jarvis:
    build: .
    container_name: easy-jarvis
    env_file: .env
    environment:
      - PULSE_SERVER=host.docker.internal
    volumes:
      - .:/app
      - ./memory:/app/memory
    stdin_open: true 
    tty: true        
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  teammate:
    build: .
    container_name: easy-jarvis-teammate
    env_file: .env
    volumes:
      - .:/app
    command: ["python3", "src/scripts/night_shift.py"]
    restart: unless-stopped
    depends_on:
      - easy-jarvis
      - local-llm

  local-llm:
    image: ghcr.io/ggerganov/llama.cpp:full
    container_name: easy-jarvis-local-llm
    volumes:
      - ./models:/models
    entrypoint: ["/llama-server"]
    environment:
      - LLAMA_ARG_MODEL=/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf
      - LLAMA_ARG_CTX_SIZE=8192
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_HOST=0.0.0.0
    ports:
      - "8080:8080"
    restart: unless-stopped

